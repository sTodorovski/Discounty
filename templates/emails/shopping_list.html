<h2>Your Shopping List</h2>

<table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; width: 100%;">
    <thead>
        <tr style="background-color: #f2f2f2;">
            <th>Product</th>
            <th>Market</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Subtotal</th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.market }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.price }} ден.</td>
            <td>{{ item.subtotal }} ден.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h3 style="margin-top: 15px;">TOTAL: {{ total }} ден.</h3>
